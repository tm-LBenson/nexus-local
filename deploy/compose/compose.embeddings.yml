# Use with:
# docker compose -f compose.cpu.yml -f compose.embeddings.yml up --build

services:
  embedding-gateway:
    image: ${EMBEDDING_GATEWAY_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      - "--model-id"
      - "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
    environment:
      API_KEY: ${EMBEDDING_API_KEY:-}
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "${EMBEDDING_GATEWAY_PORT:-8082}:80"
    volumes:
      - embedding-cache:/data

  api:
    environment:
      PROVIDER_PRESET: semantic
      EMBEDDING_BACKEND: openai-compatible
      EMBEDDING_BASE_URL: http://embedding-gateway:80/v1
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
    depends_on:
      embedding-gateway:
        condition: service_started

  worker:
    environment:
      EMBEDDING_BACKEND: openai-compatible
      EMBEDDING_BASE_URL: http://embedding-gateway:80/v1
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
    depends_on:
      embedding-gateway:
        condition: service_started

volumes:
  embedding-cache:
