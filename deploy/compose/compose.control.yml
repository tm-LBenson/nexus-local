# Optional local operator controls.
# Mounting the Docker socket lets the API stop this Compose project from the UI.
services:
  api:
    environment:
      UI_SHUTDOWN_ENABLED: ${UI_SHUTDOWN_ENABLED:-true}
      UI_SHUTDOWN_DOCKER_SOCKET: /var/run/docker.sock
      UI_SHUTDOWN_COMPOSE_PROJECT: ${UI_SHUTDOWN_COMPOSE_PROJECT:-nexus-local}
      UI_SHUTDOWN_STOP_TIMEOUT: ${UI_SHUTDOWN_STOP_TIMEOUT:-10s}
    volumes:
      - type: bind
        source: ${UI_SHUTDOWN_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
