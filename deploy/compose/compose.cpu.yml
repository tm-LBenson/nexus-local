name: nexus-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  api:
    build:
      context: ../../services/api
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      PERSISTENCE_BACKEND: memory
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: documents
      VECTOR_BACKEND: qdrant
      VECTOR_BASE_URL: http://qdrant:6333
      QUEUE_BACKEND: nats
      QUEUE_URL: nats://nats:4222
      CACHE_URL: redis://valkey:6379/0
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://host.docker.internal:8000/v1}
      DEFAULT_MODEL_TARGET: general
      GENERAL_MODEL_ID: ${GENERAL_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      nats:
        condition: service_started
      valkey:
        condition: service_started

  web:
    build:
      context: ../../apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  qdrant-data:
  nats-data:
  valkey-data:
