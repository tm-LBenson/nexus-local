name: nexus-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  nats:
    image: nats:2-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  api:
    build:
      context: ../../services/api
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: "${HTTP_ADDR:-:8080}"
      CORS_ALLOWED_ORIGIN: "${CORS_ALLOWED_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}"
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-cpu-lite}
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_USER_ID: ${DEV_USER_ID:-user_1}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@example.local}
      TRUSTED_USER_ID_HEADER: ${TRUSTED_USER_ID_HEADER:-X-User-ID}
      TRUSTED_EMAIL_HEADER: ${TRUSTED_EMAIL_HEADER:-X-User-Email}
      PERSISTENCE_BACKEND: postgres
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documents}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8082/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      VECTOR_BACKEND: qdrant
      VECTOR_BASE_URL: http://qdrant:6333
      VECTOR_COLLECTION: documents
      VECTOR_API_KEY: ${VECTOR_API_KEY:-}
      QUEUE_BACKEND: nats
      QUEUE_URL: nats://nats:4222
      CACHE_URL: redis://valkey:6379/0
      PROVIDER_PRESET: ${PROVIDER_PRESET:-starter}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://host.docker.internal:8000/v1}
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      DEFAULT_MODEL_TARGET: general
      GENERAL_MODEL_ID: ${GENERAL_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      nats:
        condition: service_started
      valkey:
        condition: service_started

  worker:
    build:
      context: ../../services/api
    entrypoint: ["/worker"]
    environment:
      APP_ENV: local
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-cpu-lite}
      PERSISTENCE_BACKEND: postgres
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documents}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8082/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-embedding}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      VECTOR_BACKEND: qdrant
      VECTOR_BASE_URL: http://qdrant:6333
      VECTOR_COLLECTION: documents
      VECTOR_API_KEY: ${VECTOR_API_KEY:-}
      WORKER_POLL_INTERVAL: 2s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  web:
    build:
      context: ../../apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  qdrant-data:
  nats-data:
  valkey-data:
